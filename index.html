<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ivar</title>
  </head>
  <body>
    <!-- Header  -->
    <header class="header">
      <nav class="nav">
        <div class="logo">IVAR CLOTHING</div>
        <ul class="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="#products">Shop</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>

        <!--  -->
        <div class="nav-actions">
          <!-- cart -->
          <button class="cart-btn" onclick="toggleCart()">
            <span class="cart-icon">Cart 🛒</span>
            <span class="cart-count">0</span>
          </button>
        </div>
      </nav>
    </header>

    <hr />
    <!-- Temporary Line, WIll be removed after css -->

    <!-- HERO SECTION -->
    <section class="hero" id="home">
      <div class="hero-bg"></div>
      <div class="hero-content">
        <h1>Welcome to Ivar Clothing</h1>
        <p>Discover the latest trends in fashion at Ivar Clothing.</p>
        <a href="#products">Shop Collection</a>
      </div>
    </section>

    <hr />
    <!-- Temporary Line, WIll be removed after css -->

    <!-- PRODUCTS SECTION -->
    <section class="products" id="products">
      <div class="section-title">
        <h2>Featured Collections</h2>
        <p class="">Explore our latest arrivals and bestsellers.</p>
      </div>

      <div class="filters">
        <button class="filter-btn active" onclick="filterProducts('all')">
          All Items
        </button>
        <!--  -->
        <button class="filter-btn" onclick="filterProducts('men')">
          Men
        </button>
        <!--  -->
        <button class="filter-btn" onclick="filterProducts('women')">
          Women
        </button>
        <!--  -->
        <button class="filter-btn" onclick="filterProducts('accessories')">
          Accessories
        </button>
        <!--  -->
      </div>

      <div class="product-grid" id="productGrid">
        <!-- Product items will be added here -->
      </div>
    </section>

    <!-- Cart Modal -->

    <div class="cart-Modal" id="cartModal">
      <div class="cart-content">
        <div class="cart-header">
          <h3>🛒 Shopping Cart</h3>
          <button class="close-cart" onclick="toggleCart()">×</button>
        </div>

        <div class="cartItems">
          <div class="empty-cart">
            <div class="empty-cart-icon">🛒</div>
            <p>Your cart is empty</p>
          </div>
        </div>

        <div class="cart-total" id="cartTotal">
          <div class="total-price" id="totalPrice">Total: $0.00</div>
          <button
            class="checkout-btn"
            onclick="showCheckout()"
            id="checkoutBtn"
          >
            Checkout
          </button>
        </div>

        <div class="checkout-form" id="checkoutForm">
          <button class="back-to-cart" onclick="hideCheckout()">
            Back to Cart
          </button>

          <form onsubmit="processCheckout(event)">
            <div class="form-section">
              <h4>Shipping Information</h4>
              <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required />
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
              </div>
              <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required />
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="city">City</label>
                  <input type="text" id="city" name="city" required />
                </div>
                <div class="form-group">
                  <label for="state">State</label>
                  <input type="text" id="state" name="state" required />
                </div>
                <div class="form-group">
                  <label for="zip">ZIP Code</label>
                  <input type="text" id="zip" name="zip" required />
              </div>
              <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country" name="country" required>
                      <option value="PK">Pakistan</option>
                      <option value="US">United States</option>
                      <option value="CA">Canada</option>
                      <option value="UK">United Kingdom</option>
                      <option value="AU">Australia</option>
                      <option value="DE">Germany</option>
                      <option value="FR">France</option>
                      <option value="JP">Japan</option>
                    </select>
                </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
